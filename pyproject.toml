[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-room"
version = "0.1.0"
description = "Self-hosted workspace for dated, tamper-evident technical evidence about EU AI Act Article 50 transparency signals. Signals only; not legal advice."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "Pavlo Rodionov" }]
dependencies = [
    # Pinned by tag; v0.5.0 is commit cefdc38c05149b6089c9c1dfb3092fe8f30566ab
    # (docs/decisions.md, D-001, D-016). Keep docker/fixtures-site SCANNER_REF in step.
    "ai-disclosure-scan @ git+https://github.com/pyroplast/ai-disclosure-scan@v0.5.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
# Only the worker image installs this (Playwright + Chromium for rendered page scans).
browser = [
    "ai-disclosure-scan[browser] @ git+https://github.com/pyroplast/ai-disclosure-scan@v0.5.0",
    "playwright==1.48.0",
]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff==0.8.4",
]

[project.scripts]
evidence-room = "evidence_room.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"alembic/**" = ["S608"]
