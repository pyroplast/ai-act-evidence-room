name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evidence
          POSTGRES_PASSWORD: evidence
          POSTGRES_DB: evidence_room
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evidence -d evidence_room"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://evidence:evidence@localhost:5432/evidence_room
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e '.[dev]'
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest

  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and start db + app
        run: docker compose up -d --build --wait db app
      - name: Health check
        run: curl --fail --silent --show-error http://localhost:8000/healthz
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
